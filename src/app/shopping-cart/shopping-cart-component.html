<form method="post" asp-action="EmailCart">
    <br />
    <div class="">
        <div class="card border mt-4 container">
            
            <div class="card-header text-light ml-0 row bg-secondary bg-gradient ml-0 py-3">
                <div class="col-6">
                    <h3 class="text-white"><i class="bi bi-cart"></i> &nbsp; Shopping Cart</h3>
                </div>
                <div class="col-6 text-end">
                    <a  class="btn text-light btn-outline-primary mt-2 btn-sm" href="/">Continue
                        Shopping</a>
                </div>
            </div>
            <div class="card-body">
                <div class=" d-none d-lg-block">
                    <div class="row text-info">
                        <div class="col-lg-2">
                        </div>
                        <div class="col-lg-4">
                            Product Details
                        </div>
                        <div class="col-lg-1">
                            Price
                        </div>
                        <div class="col-lg-1">
                            Count
                        </div>
                        <div class="col-lg-1">
                            Subtotal
                        </div>
                        <div class="col-lg-1">
                            In Stock
                        </div>
                        <div class="col-lg-1">
                            &nbsp;
                        </div>
                    </div>
                </div>
                <hr />

                <div class="row h-100">
                    <div class="col-2 col-md-2 text-center py-2">
                        <img src="https://placehold.co/600x400" class="rounded" width="100%" />
                    </div>
                    <div class="col-2 col-md-4">
                        <h5>Product 1</h5>
                        <div style="font-size:11px;">Product description</div>
                    </div>
                    <div class="col-1 col-md-1 pt-md-1" style="font-size:11px;">
                        <span style="font-size:17px;">$14.99</span>
                    </div>
                    <div class="col-1 col-md-1 pt-md-1" style="font-size:11px;">
                        <span style="font-size:17px;">1</span>
                    </div>
                    <div class="col-1 col-md-1 pt-md-1" style="font-size:11px;">
                        <span style="font-size:17px;">$14.99</span>
                    </div>
                    <div class="col-1 col-md-1 pt-md-1" style="font-size:11px; text-align: center">
                        <span style="font-size:17px">100</span>
                    </div>
                    <div class="col-1 col-md-1 pt-md-1">
                        <a asp-action="Remove" asp-route-cartDetailsId="@cartObj.CartDetailsId"
                            class="btn btn-sm btn-danger">
                            <i class="bi bi-trash-fill"></i>
                        </a>
                    </div>
                </div>
                <hr />
                <div class="row">
                    <div class="col-6">
                        <span>Coupon: &nbsp;</span>
                        <input asp-for="CartHeader.CouponCode" />&nbsp;
                        <button type="submit" asp-action="ApplyCoupon" class="btn btn-sm btn-success"> Apply </button>
                    </div>
                    <div class="col-6 text-end">
                        <span class="text-danger" style="font-size:21px;"> Order Total : $14.99
                         <br /></span>
                    </div>
                </div>
            </div>
            <div class="card-footer row">
                <div class="col-6 col-md-3 ">
                    <a asp-action="DeleteCart" class="btn btn-danger">Empty Cart</a>
                </div>
                <div class="col-6 col-md-3 offset-md-6">
                    <a asp-action="Checkout" class="btn btn-success form-control">Checkout </a>
                </div>
            </div>
        </div>
    </div>
</form>
