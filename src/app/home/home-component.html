<form>
    <div class="container row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="p-0 my-3 border rounded">
                    <div class="card">
                        <h3 class="card-title text-white-50 text-center py-2">Product 1</h3>
                        <img src="https://placehold.co/600x400" class="card-img-top py-3">
                        <div class="card-body">
                            <div class="d-flex justify-content-between py-2">
                                <span class="text-danger" style="font-size:20px;">$14.99</span>
                                <span class="text-bg-primary">In Stock: 100</span>
                                <span class="badge bg-warning text-white p-2">Products</span>
                            </div>
                            <p class="card-text">Product description</p>
                            <div class="row">
                                <div class="col">
                                    <a asp-action="ProductDetails" asp-route-productId="@product.ProductId"
                                        class="btn btn-success form-control">Details</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
</form>
