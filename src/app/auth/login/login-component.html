<form method="post" #form="ngForm" (ngSubmit)="onSubmit(form.value)">
    <div class="container border p-4">
        <div class="row text-center">
            <h1>Login</h1>
        </div>
        <div class="row">
            <div class="col-12 col-md-6 offset-md-3 pb-2">
                <input class="form-control" placeholder="Username..." name="userName" ngModel/>
                <span class="text-danger"></span>
            </div>
            <div class="col-12 col-md-6 offset-md-3 pb-2">
                <input class="form-control" type="password" placeholder="Password..." name="password" ngModel/>
                <span class="text-danger"></span>
            </div>
            <div class="col-12 col-md-6 offset-md-3 pb-2">
                <button type="submit" class="form-control btn btn-success" value="Submit" >Login</button>
            </div>
        </div>
    </div>
</form>
