<form method="post" #form="ngForm" (ngSubmit)="onSubmit(form.value)">
    <div class="container border p-4">
        <div class="row text-center p-3">
            <h1>Register</h1>
        </div>
        <div class="row">
            <div class="col-12 col-md-6 offset-md-3 pb-2">
                <input class="form-control" placeholder="Email..." name="email" ngModel/>
                <span class="text-danger"></span>
            </div>
            <div class="col-12 col-md-6 offset-md-3 pb-2">
                <input class="form-control" placeholder="Name..." name="name" ngModel/>
                <span class="text-danger"></span>
            </div>
            <div class="col-12 col-md-6 offset-md-3 pb-2">
                <input class="form-control" placeholder="Phone Number..." name="phone" ngModel/>
                <span class="text-danger"></span>
            </div>
            <div class="col-12 col-md-6 offset-md-3 pb-2">
                <input class="form-control" type="password" placeholder="Password..." name="password" ngModel/>
                <span class="text-danger"></span>
            </div>
            <div class="col-12 col-md-6 offset-md-3 pb-2">
                <select class="form-select" name="role" ngModel>
                    <option value="" disabled selected>--Select Role--</option>
                    <option value="CUSTOMER">CUSTOMER</option>
                    <option value="ADMIN">ADMIN</option>
                </select>
            </div>

            <div class="col-12 col-md-6 offset-md-3 pb-2">
                <button type="submit" class="form-control btn btn-success" value="Submit" >Register</button>
            </div>
        </div>
    </div>
</form>
