<div class="card shadow border-0 mt-4">
	<div class="card-header bg-secondary bg-gradient ml-0 py-3">
		<div class="row">
			<div class="col-12 text-center">
				<h1 class="text-white">Products List</h1>
			</div>
		</div>
	</div>
	<div class="card-body p-4">
		<div class="row pb-3">
			<div class="col-6">
			</div>
			<div class="col-6 text-end">
				<a href="/product/create" class="btn btn-outline-primary"><i class="bi bi-plus-square"></i> Create New Product</a>

			</div>
		</div>
		<table class="table">
			<thead>
				<tr>
					<th>
						Name
					</th>
					<th>
						Category Name
					</th>
					<th>
						Price
					</th>
					<th>
						In Stock
					</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
					<tr>
						<td>
							Product 1
						</td>
						<td>
							Category 1
						</td>
						<td>
							$14.99
						</td>
						<td>
							100
						</td>
						<td>
							<a href="/product/edit" class="btn btn-success" asp-action="ProductEdit" asp-route-productId="@item.ProductId">
								<i class="bi bi-pencil-square"></i>
							</a>&nbsp;
							<a class="btn btn-danger" asp-action="DeleteProduct" asp-route-productId="@item.ProductId">
								<i class="bi bi-trash"></i>
							</a>
						</td>
					</tr>
			</tbody>
		</table>

	</div>

</div>
