<form asp-action="ProductEdit" enctype="multipart/form-data">
    <br />
    <div class="container border p-3">
	<div class="card-header bg-secondary bg-gradient ml-0 py-3">
		<div class="row">
			<div class="col-12 text-center">
				<h1 class="text-white">Edit Product</h1>
			</div>
		</div>
	</div>
        <input hidden asp-for="ProductId" />
        <hr />
        <div class="row">
            <div class="col-10">
                <div class="row">
                    <div class="col-2">
                        <label class="control-label pt-2" style="font-size:20px;"> Name</label>
                    </div>
                    <div class="col-10 pb-3">
                        <input  class="form-control" value="{{product.name}}"/>
                        <span class="text-danger"></span>
                    </div>
                    <div class="col-2">
                        <label class="control-label pt-2" style="font-size:20px;">Category Name</label>
                    </div>
                    <div class="col-10 pb-3">
                        <input class="form-control" value="{{product.categoryName}}"/>
                        <span class="text-danger"></span>
                    </div>
                    <div class="col-2">
                        <label class="control-label pt-2" style="font-size:20px;">Description</label>
                    </div>
                    <div class="col-10 pb-3">
                        <textarea class="form-control" rows="5" value="{{product.description}}"></textarea>
                        <span asp-validation-for="Description" class="text-danger"></span>
                    </div>
                    <div class="col-2">
                        <label class="control-label pt-2" style="font-size:20px;">Price (USD)</label>
                    </div>
                    <div class="col-10 pb-3">
                        <input class="form-control" value="{{product.price}}"/>
                        <span asp-validation-for="Price" class="text-danger"></span>
                    </div>
                    <div class="col-2">
                        <label class="control-label pt-2" style="font-size:20px;">In Stock</label>
                    </div>
                    <div class="col-10 pb-3">
                        <input class="form-control" value="{{product.stockInventory}}"/>
                        <span class="text-danger"></span>
                    </div>
                    <div class="col-2">
                        <label class="control-label pt-2" style="font-size:20px;">ImageUrl</label>
                    </div>
                    <div class="col-10 pb-3">
                        <input class="form-control" />
                        <input hidden class="form-control" />
                        <input hidden class="form-control" />
                        <span class="text-danger"></span>
                    </div>

                    <div class="col-5 offset-2">
                        <a href="/product" asp-action="ProductIndex" class="btn-primary btn form-control ">Back to products</a>
                    </div>
                    <div class="col-5">
                        <input type="submit" value="Update" class="btn btn-success form-control" />
                    </div>

                </div>
            </div>
            <div class="col-2">
                <img src="{{product.imageUrl}}" class="w-100" alt="" />
            </div>
        </div>
    </div>
</form>
